name: Build unsigned macOS DMG

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Test and build the universal DMG (unsigned)
        run: npm run build:mac 2>&1 | tee mac-build.log
      - name: Upload build log for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proimport-macos-build-log
          path: mac-build.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: proimport-macos-unsigned-test-dmg
          path: installer-output-macos/*.dmg
          if-no-files-found: error
          retention-days: 7
      - name: Publish DMG as a public GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: macos-build-${{ github.run_number }}
          name: Proİmport macOS build ${{ github.run_number }}
          body: |
            Universal DMG for macOS 13 and newer (Intel and Apple silicon).

            This build is unsigned and not notarized. macOS may show a Gatekeeper warning on first launch.
          prerelease: true
          files: installer-output-macos/*.dmg
